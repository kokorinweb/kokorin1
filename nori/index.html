<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>НОРИ — японская кухня</title><style>html,body{margin:0;background:#f4f0e8;font-family:system-ui,sans-serif}#loading{height:100vh;display:grid;place-items:center;color:#141311}#loading b{font-size:28px;letter-spacing:.12em}</style></head><body><div id="loading"><b>НОРИ</b></div><script>(async()=>{const base='https://raw.githubusercontent.com/kokorinweb/kokorin1/nori-live/nori/';const parts=await Promise.all([0,1,2,3,4].map(i=>fetch(base+'chunk'+i+'.b64?'+Date.now()).then(r=>{if(!r.ok)throw new Error('chunk '+i);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const html=new TextDecoder('utf-8').decode(bytes);document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<pre style="padding:24px">Ошибка загрузки сайта: '+e.message+'</pre>'})</script></body></html>
